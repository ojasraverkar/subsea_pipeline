[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subsea-pipeline-insulation"
version = "1.0.0"
description = "Educational thermal performance model and Streamlit dashboard for a multilayer subsea oil pipeline."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36,<2.0",
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "plotly>=5.20,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
